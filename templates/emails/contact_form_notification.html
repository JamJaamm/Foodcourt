<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 20px;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
        <!-- Header -->
        <tr>
          <td style="background:linear-gradient(135deg,#ff6b35,#f57f17);padding:24px 32px;border-radius:16px 16px 0 0;">
            <h1 style="margin:0;font-size:22px;font-weight:800;color:#fff;">New Contact Form Submission</h1>
            <p style="margin:6px 0 0;font-size:13px;color:rgba(255,255,255,0.8);">Choply Support</p>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="background:#fff;padding:32px;">
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:10px 0;font-size:14px;color:#6b7280;border-bottom:1px solid #e5e7eb;"><strong style="color:#111827;">Name:</strong></td>
                <td style="padding:10px 0;font-size:14px;color:#111827;border-bottom:1px solid #e5e7eb;">{{ name }}</td>
              </tr>
              <tr>
                <td style="padding:10px 0;font-size:14px;color:#6b7280;border-bottom:1px solid #e5e7eb;"><strong style="color:#111827;">Email:</strong></td>
                <td style="padding:10px 0;font-size:14px;color:#111827;border-bottom:1px solid #e5e7eb;">{{ sender_email }}</td>
              </tr>
              <tr>
                <td style="padding:10px 0;font-size:14px;color:#6b7280;border-bottom:1px solid #e5e7eb;"><strong style="color:#111827;">Category:</strong></td>
                <td style="padding:10px 0;font-size:14px;color:#111827;border-bottom:1px solid #e5e7eb;">{{ category }}</td>
              </tr>
              <tr>
                <td style="padding:10px 0;font-size:14px;color:#6b7280;"><strong style="color:#111827;">Subject:</strong></td>
                <td style="padding:10px 0;font-size:14px;color:#111827;">{{ subject }}</td>
              </tr>
            </table>
            <div style="margin-top:24px;padding:20px;background:#f9fafb;border-radius:10px;border:1px solid #e5e7eb;">
              <p style="margin:0 0 8px;font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;">Message</p>
              <p style="margin:0;font-size:15px;line-height:1.7;color:#111827;">{{ message }}</p>
            </div>
            <p style="margin-top:24px;font-size:13px;color:#6b7280;text-align:center;">Reply directly to <a href="mailto:{{ sender_email }}" style="color:#ff6b35;">{{ sender_email }}</a> to respond to this enquiry.</p>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="background:#111827;padding:20px 32px;border-radius:0 0 16px 16px;text-align:center;">
            <p style="margin:0;font-size:12px;color:rgba(255,255,255,0.4);">© 2026 Choply Inc. This message was sent via the Choply Contact Form.</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
