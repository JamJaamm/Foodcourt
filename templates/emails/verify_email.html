<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #0c0c16, #171738); padding: 32px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 24px; font-weight: 800; }
    .header span { color: #FF6B35; }
    .body { padding: 32px; }
    .body p { color: #555; line-height: 1.6; font-size: 15px; }
    .code { text-align: center; font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #FF6B35; background: #fff5f0; border-radius: 12px; padding: 20px; margin: 24px 0; }
    .footer { text-align: center; padding: 24px 32px; border-top: 1px solid #eee; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔥 Food<span>Court</span></h1>
    </div>
    <div class="body">
      <h2>Verify your email address</h2>
      <p>Thanks for signing up! Use the verification code below to activate your account.</p>
      <div class="code">{{ code }}</div>
      <p>This code expires in <strong>10 minutes</strong>. If you didn't request this, you can safely ignore this email.</p>
    </div>
    <div class="footer">
      <p>&copy; 2026 FoodCourt Inc. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
