{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){var t=localStorage.getItem('rdr-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Choply Rider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/rider.css' %}">
  <link rel="shortcut icon" href="{% static 'images/7541708.png' %}" type="image/x-icon">
</head>
<body>
<div class="rdr-auth">
  <div class="rdr-auth-visual">
    <a href="/riders/" class="brand">
      <div class="rdr-brand-icon"><i class="fa-solid fa-motorcycle"></i></div>
      <div>
        <div class="rdr-brand-name" style="color:#fff;">Choply</div>
        <div class="rdr-brand-tag" style="color:var(--rdr-green);">Rider Hub</div>
      </div>
    </a>
    <h1>Forgot your <span class="gr">password?</span></h1>
    <p>Enter your email address and we'll send you a verification code to reset your password.</p>
  </div>
  <div class="rdr-auth-form">
    <div class="rdr-auth-card">
      <a href="/riders/login/" class="back"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
      <h2>Reset Password</h2>
      <p class="sub">We'll email you a 6-digit code.</p>

      {% if error %}
      <div class="rdr-auth-error show">{{ error }}</div>
      {% endif %}

      <form method="POST" novalidate>
        {% csrf_token %}
        <div class="rdr-field">
          <label class="rdr-label">Email Address</label>
          <input type="email" class="rdr-input" name="email" placeholder="you@example.com" value="{{ email_val }}" required>
        </div>
        <button type="submit" class="rdr-btn rdr-btn-primary" style="width:100%;">
          <i class="fa-solid fa-paper-plane"></i> Send Reset Code
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
